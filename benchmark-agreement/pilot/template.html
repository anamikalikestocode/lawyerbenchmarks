<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Which answer is better?</title>
<style>
/* layout: one reading column; the task on top, two answers side by side, three buttons under them */
:root{--bg:#ffffff;--fg:#14110f;--mute:#5d5650;--line:#e4ddd6;--card:#faf6f2;--accent:#d9480f;--on:#ffffff;
 --text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161412;--fg:#f1ece7;--mute:#b3aaa2;--line:#3a342f;--card:#201d1a;--accent:#f0764a;--on:#161412;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161412;--fg:#f1ece7;--mute:#b3aaa2;--line:#3a342f;--card:#201d1a;--accent:#f0764a;--on:#161412;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--text);padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0;font-weight:600}
p{margin:0}.mute{color:var(--mute)}
.task{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;white-space:pre-wrap;max-width:76ch}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ans{border:1px solid var(--line);border-radius:6px;padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.ans .txt{white-space:pre-wrap}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:600 16px var(--text);padding:12px 18px;border-radius:6px;border:1px solid var(--fg);background:var(--bg);color:var(--fg);cursor:pointer}
button.pick{background:var(--accent);border-color:var(--accent);color:var(--on)}
button.quiet{border-color:var(--line);font-weight:500}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;max-width:420px}
input,textarea{font:16px var(--text);padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
textarea{min-height:120px;font-size:13px;word-break:break-all}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
@media (max-width:720px){.pair{grid-template-columns:1fr}h1{font-size:24px}}
</style></head><body><main id="app"></main>
<script>
const TASKS=/*DATA*/;
const PAIRS=TASKS.flatMap(t=>t.pairs.map(p=>({...p,task:t})));
const KEY='lawyer-pilot-v1';
let S={who:{name:'',area:'',years:''},r:{},i:-1};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.r)S=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const app=document.getElementById('app');
const el=(tag,props={},kids=[])=>{const n=Object.assign(document.createElement(tag),props);kids.forEach(k=>n.append(k));return n};
function intro(){
  app.replaceChildren(
    el('h1',{textContent:'Which answer is better?'}),
    el('p',{textContent:'You will see a short legal task and two answers to it, side by side. Pick the one you would rather send to the client. There are '+PAIRS.length+' comparisons across '+TASKS.length+' tasks, and it takes about 45 minutes.'}),
    el('ol',{},[
      el('li',{textContent:'Judge the way you would judge a junior lawyer\'s draft. There is no rubric and no right answer.'}),
      el('li',{textContent:'If you honestly cannot choose, use "Too close to call". Please use it sparingly.'}),
      el('li',{textContent:'Your progress is saved in this browser, so you can stop and come back.'})]),
    field('name','Your name or initials','name'),field('area','Practice area','area'),field('years','Years in practice','years'),
    el('div',{className:'row'},[el('button',{className:'pick',textContent:Object.keys(S.r).length?'Continue':'Start',onclick:()=>{
      ['name','area','years'].forEach(k=>S.who[k]=document.getElementById(k).value.trim());
      S.i=Math.max(0,PAIRS.findIndex(p=>!S.r[p.id]));if(S.i<0)S.i=PAIRS.length;save();show()}})]));
}
function field(id,label,k){return el('label',{htmlFor:id,textContent:label},[el('input',{id:id,value:S.who[k]||'',autocomplete:'off'})])}
function show(){
  if(S.i>=PAIRS.length)return done();
  const p=PAIRS[S.i],t=p.task,n=TASKS.indexOf(t)+1;
  const pick=v=>{S.r[p.id]=v;S.i++;save();show();scrollTo(0,0)};
  const card=(side,idx)=>el('div',{className:'ans'},[el('h2',{textContent:'Answer '+side}),el('div',{className:'txt',textContent:t.answers[idx]})]);
  app.replaceChildren(
    el('div',{className:'bar'},[el('i',{style:'width:'+(100*S.i/PAIRS.length)+'%'})]),
    el('p',{className:'mute',textContent:'Comparison '+(S.i+1)+' of '+PAIRS.length+' · Task '+n+' of '+TASKS.length+': '+t.title}),
    el('div',{className:'task',textContent:t.prompt}),
    el('div',{className:'pair'},[card('A',p.l),card('B',p.r)]),
    el('div',{className:'row'},[
      el('button',{className:'pick',textContent:'A is better',onclick:()=>pick('L')}),
      el('button',{className:'pick',textContent:'B is better',onclick:()=>pick('R')}),
      el('button',{className:'quiet',textContent:'Too close to call',onclick:()=>pick('T')}),
      el('button',{className:'quiet',textContent:'Back',disabled:S.i===0,onclick:()=>{S.i--;save();show()}})]));
}
function done(){
  const code=btoa(unescape(encodeURIComponent(JSON.stringify({v:1,who:S.who,r:S.r}))));
  const ta=el('textarea',{id:'code',readOnly:true,value:code});
  const note=el('p',{className:'mute',textContent:''});
  app.replaceChildren(
    el('h1',{textContent:'Done. Thank you.'}),
    el('p',{textContent:'One last step: copy the code below and send it back to the person who asked you to do this. It holds your choices and nothing else.'}),
    ta,
    el('div',{className:'row'},[
      el('button',{className:'pick',textContent:'Copy the code',onclick:()=>{ta.select();(navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>note.textContent='Copied.',()=>note.textContent='Select the code above and copy it.')}}),
      el('button',{className:'quiet',textContent:'Review my answers',onclick:()=>{S.i=0;save();show()}})]),note);
}
S.i<0||!S.who.name&&!Object.keys(S.r).length?intro():intro();
</script></body></html>
