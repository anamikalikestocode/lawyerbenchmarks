<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lawyer benchmarks</title>
  <meta name="description" content="legal benchmarks are cool.">
  <meta property="og:title" content="lawyer benchmarks">
  <meta property="og:description" content="legal benchmarks are cool.">
  <meta property="og:url" content="https://lawyerbenchmarks.com/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Crect x='7' y='17' width='4' height='8' fill='%23fff'/%3E%3Crect x='14' y='12' width='4' height='13' fill='%23fff'/%3E%3Crect x='21' y='7' width='4' height='18' fill='%23ff3b30'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #000;
      --ink: #fff;
      --accent: #ff3b30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px clamp(16px, 5vw, 64px);
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      height: 72px;
      margin-bottom: 36px;
    }
    .bars span {
      width: 18px;
      background: var(--ink);
      transform-origin: bottom;
      animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both;
    }
    .bars span:nth-child(1) { height: 30%; animation-delay: 0.05s; }
    .bars span:nth-child(2) { height: 48%; animation-delay: 0.15s; }
    .bars span:nth-child(3) { height: 62%; animation-delay: 0.25s; }
    .bars span:nth-child(4) { height: 100%; animation-delay: 0.35s; background: var(--accent); }

    @keyframes rise {
      from { transform: scaleY(0); }
      to   { transform: scaleY(1); }
    }

    h1 {
      font-weight: 700;
      font-size: clamp(48px, 11vw, 160px);
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-transform: lowercase;
    }
    h1 .cool { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      .bars span { animation: none; }
    }
  </style>
</head>
<body>
  <div class="bars" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>
  <h1>legal benchmarks<br>are <span class="cool">cool.</span></h1>
</body>
</html>
